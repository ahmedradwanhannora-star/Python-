<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بنك إجابات بايثون </title>
<style>
:root{--primary:#10b981;--primary-dark:#059669;--bg:#0f172a;--card-bg:#1e293b;--text:#f8fafc;--text-muted:#94a3b8;--border:#334155;--code-bg:#090d16;--gold:#fbbf24}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.7}
#auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .5s ease}
.auth-card{background:var(--card-bg);padding:2.5rem;border-radius:16px;border:1px solid var(--border);text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.5);max-width:400px;width:90%}
.auth-card h2{color:var(--primary);margin-bottom:.5rem}
.auth-card p{color:var(--text-muted);margin-bottom:1.5rem}
.auth-card input{width:100%;padding:.75rem;border-radius:8px;border:1px solid var(--border);background:var(--code-bg);color:#fff;font-size:1.2rem;text-align:center;margin-bottom:1rem;outline:none}
.auth-card input:focus{border-color:var(--primary)}
.auth-card button{background:var(--primary);color:#fff;border:0;padding:.75rem 1.5rem;border-radius:8px;font-size:1rem;cursor:pointer;width:100%;font-weight:bold;transition:background .3s}
.auth-card button:hover{background:var(--primary-dark)}
.error-msg{color:#ef4444;margin-top:.75rem;font-size:.9rem;display:none}
#welcome-effect{position:fixed;inset:0;background:rgba(15,23,42,.98);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9998;animation:fadeIn .5s ease}
#welcome-effect h1{color:var(--primary);font-size:2.5rem;text-align:center;text-shadow:0 0 20px rgba(16,185,129,.4);animation:scaleUp .8s cubic-bezier(.175,.885,.32,1.275) forwards;padding:0 1rem}
@keyframes scaleUp{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#main-content{display:none;animation:fadeIn .8s ease}
header{background:linear-gradient(135deg,#065f46,var(--primary));color:#fff;text-align:center;padding:2.5rem 1rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.3)}
header h1{margin:0 0 .5rem;font-size:2.2rem}
header p{margin:0;opacity:.9;font-size:1.1rem}
.container{max-width:900px;margin:0 auto 2rem;padding:0 1rem}
.toolbar{position:sticky;top:0;z-index:50;background:var(--bg);padding:14px 0 6px}
#q{width:100%;padding:.8rem 1.2rem;border-radius:30px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:1rem;outline:none}
#q:focus{border-color:var(--primary)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:thin}
.chip{flex:none;background:var(--card-bg);border:1px solid var(--border);color:var(--text-muted);border-radius:20px;padding:4px 12px;font-size:.8rem;cursor:pointer;transition:.2s}
.chip:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.chapter-section{background:var(--card-bg);border-radius:12px;border:1px solid var(--border);margin-bottom:1.2rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.2);overflow:hidden;scroll-margin-top:110px}
summary.chapter-title{background:#0f766e;color:#fff;padding:1rem 1.5rem;font-size:1.3rem;font-weight:bold;cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none;transition:background .2s}
summary.chapter-title:hover{background:#0d9488}
summary::-webkit-details-marker{display:none}
summary small{font-size:.8rem;font-weight:400;opacity:.8}
summary:after{content:"▾";transition:transform .2s;margin-right:10px}
details[open]>summary:after{transform:rotate(180deg)}
.answers-list{padding:1.5rem}
.answer-wrapper{background:var(--code-bg);border:1px solid var(--border);border-right:5px solid var(--primary);border-radius:8px;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;overflow:hidden;transition:transform .2s,box-shadow .2s}
.answer-wrapper:hover{transform:translateX(-3px);box-shadow:0 0 12px rgba(16,185,129,.25)}
.answer-item{padding:1rem 1.25rem;font-family:'Courier New',Courier,monospace;white-space:pre-wrap;direction:ltr;text-align:left;color:#34d399;flex-grow:1;overflow-x:auto}
.copy-btn{background:#334155;color:#fff;border:0;padding:.5rem .8rem;margin:.5rem;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:bold;transition:background .2s,transform .1s;white-space:nowrap}
.copy-btn:hover,.copy-btn.copied{background:var(--primary)}
.copy-btn:active{transform:scale(.95)}
.choice{background:rgba(251,191,36,.08);border:2px dashed var(--gold);border-radius:10px;padding:.8rem 1.2rem;margin-bottom:1rem;color:#fde68a;font-weight:600;line-height:1.8;white-space:pre-wrap}
.choice b{display:inline-block;background:var(--gold);color:#422006;border-radius:20px;padding:0 10px;font-size:.75rem;margin-left:8px}
#none{text-align:center;color:var(--text-muted);padding:30px;display:none}
footer{text-align:center;padding:2rem;color:var(--text-muted);font-size:.9rem;border-top:1px solid var(--border);margin-top:3rem}
.whatsapp-float{position:fixed;bottom:20px;right:20px;background:#25d366;color:#fff;border-radius:50px;padding:10px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:100;transition:transform .3s,background .3s}
.whatsapp-float:hover{background:#20ba5a;transform:scale(1.05)}
.whatsapp-float svg{width:24px;height:24px;fill:#fff}
#top{position:fixed;bottom:20px;left:20px;width:44px;height:44px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.2rem;cursor:pointer;z-index:100;display:none}
</style>
</head>

function verifyPassword(){
  const ok=document.getElementById("password-input").value===CORRECT_PASSWORD;
  if(!ok){document.getElementById("error-msg").style.display="block";return}
  const a=document.getElementById("auth-screen");a.style.opacity="0";
  setTimeout(()=>{a.style.display="none";
    const w=document.getElementById("welcome-effect");w.style.display="flex";
    setTimeout(()=>{w.style.display="none";document.getElementById("main-content").style.display="block"},2000);
  },500);
}
function copyText(btn,text){
  navigator.clipboard.writeText(text).then(()=>{
    const o=btn.innerText;btn.innerText="تم النسخ!";btn.classList.add("copied");
    setTimeout(()=>{btn.innerText=o;btn.classList.remove("copied")},1500);
  }).catch(e=>console.error("فشل النسخ: ",e));
}

const list=document.getElementById("list"),chips=document.getElementById("chips");
D.forEach(([title,body,split],i)=>{
  let items=body.split("\n~~\n");
  if(split)items=items.flatMap(x=>x.startsWith("@@")?[x]:x.split("\n\n"));
  const d=document.createElement("details");d.className="chapter-section";d.id="c"+i;if(i===0)d.open=true;
  d.innerHTML=`<summary class="chapter-title"><span></span><small>${items.length} إجابة</small></summary><div class="answers-list"></div>`;
  d.querySelector("span").textContent=title;
  const box=d.querySelector(".answers-list");
  items.forEach(t=>{
    if(t.startsWith("@@")){
      const c=document.createElement("div");c.className="choice";
      c.innerHTML="<b>✅ إجابة</b>";c.append(document.createTextNode(t.slice(2)));box.append(c);return;
    }
    const w=document.createElement("div");w.className="answer-wrapper";
    const a=document.createElement("div");a.className="answer-item";a.textContent=t;
    const b=document.createElement("button");b.className="copy-btn";b.textContent="نسخ";
    b.onclick=()=>copyText(b,t);
    w.append(a,b);box.append(w);
  });
  list.append(d);
  const ch=document.createElement("button");ch.className="chip";
  ch.textContent=title.replace("الفصل ","").replace("مراجعة","م.").replace(" بايثون","");
  ch.onclick=()=>{d.open=true;d.scrollIntoView()};
  chips.append(ch);
});

document.getElementById("q").oninput=e=>{
  const v=e.target.value.trim().toLowerCase();let any=false;
  document.querySelectorAll("details").forEach(d=>{
    const th=d.querySelector("span").textContent.toLowerCase().includes(v);
    let n=0;
    d.querySelectorAll(".answer-wrapper,.choice").forEach(s=>{
      const hit=!v||th||s.textContent.toLowerCase().includes(v);
      s.style.display=hit?"":"none";if(hit)n++;
    });
    d.style.display=n?"":"none";if(v)d.open=n>0;if(n)any=true;
  });
  document.getElementById("none").style.display=any?"none":"block";
};
